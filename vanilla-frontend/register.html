<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Clinic Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav class="navbar">
    <div class="container flex items-center justify-between">
      <a href="index.html" class="nav-logo">
        <div class="nav-icon">🏥</div>
        <span class="nav-text">Clinic Manager</span>
      </a>
      <div class="nav-links">
        <a href="login.html" class="nav-link">Login</a>
        <a href="register.html" class="nav-link active">Register</a>
      </div>
    </div>
  </nav>

  <main class="flex-grow container animate-fade-in-up flex items-center justify-center" style="min-height: 80vh;">
    <div class="glass-card" style="width: 100%; max-width: 400px; padding: 2.5rem;">
      <h2 style="font-size: 1.875rem; font-weight: 700; color: var(--slate-900); margin-bottom: 1.5rem; text-align: center;">Create Account</h2>
      
      <div id="register-error" class="alert-error" style="display: none; padding: 1rem; border-radius: 0.5rem; background: #fee2e2; color: #b91c1c; margin-bottom: 1rem; font-size: 0.875rem;"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-username">Username</label>
          <input type="text" id="reg-username" class="form-input" required placeholder="Choose a username">
        </div>

        <div class="form-group" style="margin-top: 1rem;">
          <label class="form-label" for="reg-password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="reg-password" class="form-input" required placeholder="Create a password">
            <button type="button" class="password-toggle" onclick="togglePassword('reg-password', this)" title="Toggle password visibility">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-dark" style="width: 100%; margin-top: 1.5rem; justify-content: center;">Sign Up</button>
      </form>
      
      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--slate-500);">
        Already have an account? <a href="login.html" style="color: var(--blue-600); font-weight: 500; text-decoration: none;">Log in</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <p>&copy; 2026 Clinic Manager. All rights reserved.</p>
      <div class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
        <a href="#">Support</a>
      </div>
    </div>
  </footer>

  <script src="js/auth.js"></script>
</body>

</html>
