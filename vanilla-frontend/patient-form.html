<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Form - Clinic Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav class="navbar">
    <div class="container flex items-center justify-between">
      <a href="index.html" class="nav-logo">
        <div class="nav-icon">🏥</div>
        <span class="nav-text">Clinic Manager</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Dashboard</a>
        <a href="patients.html" class="nav-link">Patients</a>
        <a href="patient-form.html" class="nav-link" id="nav-add-link">+ Add Patient</a>
      </div>
    </div>
  </nav>

  <main class="flex-grow container animate-fade-in-up" style="padding-top: 2rem;">
    <div style="max-width: 48rem; margin: 0 auto;">
      <div style="margin-bottom: 2rem;">
        <h1 id="page-title" style="font-size: 1.875rem; font-weight: 700; color: var(--slate-800);">Register New Patient
        </h1>
        <p id="page-desc" style="color: var(--slate-500); margin-top: 0.5rem;">Enter the patient's details below to
          register them in the clinic.</p>
      </div>

      <div class="glass-card" style="padding: 2rem;">
        <form id="patient-form" style="display: flex; flex-direction: column; gap: 1.5rem;">

          <div class="form-group" style="margin-bottom: 0;">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. John Doe" required>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="age">Age</label>
              <input type="number" id="age" name="age" placeholder="e.g. 30" min="0" required>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="gender">Gender</label>
              <select id="gender" name="gender" required>
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" placeholder="e.g. 9876543210" required>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label for="appointmentDate">Appointment Date</label>
            <input type="date" id="appointmentDate" name="appointmentDate" required>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label for="medicalReason">Medical Reason</label>
            <textarea id="medicalReason" name="medicalReason" rows="3"
              placeholder="e.g. Fever, Cold, Diabetes check-up, Back pain..." required></textarea>
          </div>

          <div class="form-group" style="margin-bottom: 0;">
            <label>Medicines Required <span id="med-count"
                style="display: none; padding: 0.125rem 0.5rem; background: #dbeafe; color: #1d4ed8; font-size: 0.75rem; border-radius: 9999px; margin-left: 0.5rem;">0
                selected</span></label>
            <div class="medicines-grid" id="medicines-container">
              <!-- Checkboxes generated by JS -->
            </div>
          </div>

          <div
            style="display: flex; align-items: center; gap: 0.75rem; padding: 1rem; background: rgba(209, 250, 229, 0.5); border: 1px solid #a7f3d0; border-radius: 0.75rem;">
            <input type="checkbox" id="isDone" name="isDone"
              style="width: 1.25rem; height: 1.25rem; accent-color: var(--emerald); cursor: pointer;">
            <label for="isDone"
              style="margin-bottom: 0; font-size: 0.875rem; color: #064e3b; cursor: pointer; user-select: none;">
              Treatment complete / Consultation done
            </label>
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary"
            style="width: 100%; justify-content: center; padding: 1rem; font-size: 1rem; margin-top: 1rem;">
            Register Patient
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <p>&copy; 2026 Clinic Manager. All rights reserved.</p>
      <div class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
        <a href="#">Support</a>
      </div>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/form.js"></script>
</body>

</html>
