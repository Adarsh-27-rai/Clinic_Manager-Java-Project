<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients Directory - Clinic Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav class="navbar">
    <div class="container flex items-center justify-between">
      <a href="index.html" class="nav-logo">
        <div class="nav-icon">🏥</div>
        <span class="nav-text">Clinic Manager</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Dashboard</a>
        <a href="patients.html" class="nav-link active">Patients</a>
        <a href="patient-form.html" class="nav-link">+ Add Patient</a>
      </div>
    </div>
  </nav>

  <main class="flex-grow container animate-fade-in-up" style="padding-top: 2rem;">
    <div class="flex items-center justify-between mb-8 glass-card" style="padding: 1.5rem; border-radius: 1rem;">
      <div>
        <h1 style="font-size: 1.875rem; font-weight: 700; color: var(--slate-800);">Patient Directory</h1>
        <p id="stats-container" style="display: flex; gap: 0.75rem; margin-top: 0.25rem; font-size: 0.875rem;"></p>
      </div>
      <a href="patient-form.html" class="btn btn-primary">
        <span style="font-size: 1.125rem;">+</span> Add Patient
      </a>
    </div>

    <div id="table-container">
      <!-- Loading state -->
      <div class="text-center py-16" style="color: var(--slate-400);">Loading patients...</div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <p>&copy; 2026 Clinic Manager. All rights reserved.</p>
      <div class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
        <a href="#">Support</a>
      </div>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/patients.js"></script>
</body>

</html>
